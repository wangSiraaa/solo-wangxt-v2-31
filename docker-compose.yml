services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sim
      POSTGRES_PASSWORD: sim
      POSTGRES_DB: routing_sim
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sim -d routing_sim"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
